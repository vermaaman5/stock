name: Update fundamentals

on:
  schedule:
    # 8:30 PM IST = 15:00 UTC, weekdays (results usually come out after market hours)
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  update-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -U yfinance

      - name: Fetch quarterly results
        run: python update_fundamentals.py

      - name: Commit fundamentals.json
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ls -la fundamentals.json
          git add fundamentals.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update fundamentals $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          # Retry in case the prices job pushed at the same moment
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
